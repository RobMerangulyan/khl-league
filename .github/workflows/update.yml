name: Update KHL results

on:
  schedule:
    - cron: "17 * * * *"     # every hour, at minute 17 (UTC)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

concurrency:
  group: khl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: updater/requirements.txt
      - name: Install
        run: |
          pip install -r updater/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Update from khl.ru
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python updater/update.py
