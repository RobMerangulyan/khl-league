name: Update KHL results

on:
  schedule:
    - cron: "17 * * * *"          # every hour, all day (UTC)
    - cron: "*/5 7-21 * * *"      # every 5 minutes during KHL game hours (10:00-00:59 Moscow)
  workflow_dispatch: {}            # lets you run it by hand from the Actions tab

concurrency:
  group: khl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: updater/requirements.txt
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('updater/requirements.txt') }}
      - name: Install
        run: |
          pip install -r updater/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Update from khl.ru
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python updater/update.py
